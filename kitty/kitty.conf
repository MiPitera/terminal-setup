# kitty.conf - managed by terminal-setup
# Machine-specific overrides go in ~/.config/kitty/local.conf (not tracked).
#
# Full reference: kitty +runpy 'from kitty.config import *; print(commented_out_default_config())'

# --- Theme -----------------------------------------------------------------
# theme.conf is a symlink created by install.sh pointing into themes/.
include ./theme.conf

# --- Font ------------------------------------------------------------------
font_family      family="DM Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# DM Mono has no powerline/Nerd Font glyphs. Pull the private-use ranges the
# prompt needs from the Symbols Nerd Font that install.sh puts in
# ~/.local/share/fonts, so the prompt renders identically on every distro.
symbol_map U+E0A0-U+E0D4,U+E5FA-U+E6B7,U+F000-U+F2FF Symbols Nerd Font Mono
symbol_map U+E700-U+E8EF,U+EA60-U+EC1E Symbols Nerd Font Mono

disable_ligatures never

# --- Scrollback ------------------------------------------------------------
scrollback_lines               10000
scrollback_pager_history_size  10

# --- Bell / window ---------------------------------------------------------
enable_audio_bell      no
hide_window_decorations no
window_padding_width   4
confirm_os_window_close 1

# --- Tab bar ---------------------------------------------------------------
tab_bar_style      powerline
tab_powerline_style round

# --- Shell -----------------------------------------------------------------
# Force bash (non-login, so ~/.bashrc is read directly) even on distros whose
# default user shell differs - Kali ships zsh.
shell /bin/bash

# --- Local overrides -------------------------------------------------------
# Optional; kitty ignores a missing include prefixed with "globinclude".
globinclude local.conf
